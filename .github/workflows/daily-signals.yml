name: Daily signal generation

# D1: cloud cron for the ingestion -> analysis pipeline. Runs as a normal
# process on a GitHub-hosted runner (not a serverless function) specifically
# because the ingestion pipeline has deliberate rate-limit delays baked in
# (Twelve Data: 8s/call, Finnhub: 1.1s/call) that can exceed typical
# serverless function timeouts for more than a handful of tickers.
#
# Known gap (deferred to D2, not yet built): this fires at a fixed UTC time,
# which does not auto-adjust for US Eastern DST -- "9am ET" drifts by an hour
# twice a year until D2's real per-user timezone handling exists.
on:
  schedule:
    # Mon/Wed/Fri rather than every weekday (2026-11-19): signals use a 7-day
    # horizon, so daily runs mostly overlapped -- each one costs real Claude
    # credit without adding much independent evidence.
    - cron: "0 13 * * 1,3,5" # ~9am US Eastern, DST not accounted for (see note above)
  workflow_dispatch: {} # manual trigger, e.g. for testing this workflow itself

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    # Signals now go through the Batches API, which waits for results (usually
    # minutes; the client gives up and cancels at 4h). Leave headroom past that.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build packages/shared (Prisma client + compiled dist/)
        run: npm run build --workspace=@financial-adviser/shared

      # D4: without this, a schema change merged to main breaks the cron at
      # runtime with a confusing Prisma error, because the generated client
      # expects tables the database doesn't have yet. `migrate deploy` only
      # applies already-committed migrations -- it never generates new ones or
      # touches a shadow database, so it's safe to run unattended.
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy --schema packages/shared/prisma/schema.prisma

      - name: Run ingestion + signal generation for all tracked tickers
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: npx tsx src/scripts/run-all.ts

      # Makes a failure impossible to scroll past in the run summary. GitHub
      # emails the repo owner on a failed scheduled run; this puts the reason
      # in the summary itself rather than buried in step logs.
      - name: Report failure
        if: failure()
        run: |
          {
            echo "## Pipeline run failed"
            echo ""
            echo "The daily signal pipeline did not complete successfully."
            echo "Check the step logs above, and the \`pipeline_runs\` table for"
            echo "the recorded status and detail of this run."
          } >> "$GITHUB_STEP_SUMMARY"
